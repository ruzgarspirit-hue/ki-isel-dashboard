# Statik site — derleme yok, depo kökü yayınlanır.
[build]
  publish = "."

# Sunucu fonksiyonları (yemek fotoğrafı analizi için)
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Service worker ve config her zaman taze gelsin (eski sürüm takılmasın)
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/js/config.js"
  [headers.values]
    Cache-Control = "no-cache"
